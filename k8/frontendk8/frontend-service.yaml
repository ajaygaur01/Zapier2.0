apiVersion: v1
kind: Service
metadata:
  name: frontend-active
  namespace: zapier
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3001"
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-canary
  namespace: zapier
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3001"
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001

